<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ярмарок — маркетплейс товарів</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ===== ВЕСЬ КОД ИЗ STYLE.CSS СЮДА ===== */
        :root {
            --ink: #1B2430;
            --teal: #1F6F6B;
            --teal-dark: #124542;
            --marigold: #F2A93C;
            --marigold-dark: #D4880F;
            --brick: #C1502E;
            --paper: #FBF6EC;
            --sand: #EDE3CE;
            --sand-line: #DCCFAE;
            --white: #FFFFFF;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: .02em;
        }
        button { font-family: inherit; cursor: pointer; }
        img { max-width: 100%; display: block; }
        header.site {
            background: var(--ink);
            color: var(--paper);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 4px solid var(--marigold);
        }
        .top-bar {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 14px 20px;
        }
        .logo {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--marigold);
        }
        .search-wrap {
            flex: 1;
            display: flex;
            max-width: 640px;
        }
        .search-wrap input {
            flex: 1;
            border: 2px solid var(--teal);
            border-right: none;
            background: var(--paper);
            padding: 11px 16px;
            font-size: 15px;
            border-radius: 6px 0 0 6px;
            outline: none;
        }
        .search-wrap input:focus { border-color: var(--marigold); }
        .search-wrap button {
            background: var(--marigold);
            border: 2px solid var(--marigold);
            color: var(--ink);
            padding: 0 20px;
            border-radius: 0 6px 6px 0;
            font-weight: 700;
            font-size: 15px;
        }
        .search-wrap button:hover { background: var(--marigold-dark); }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-left: auto;
        }
        .cart-btn {
            position: relative;
            background: var(--teal);
            border: none;
            color: var(--paper);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-btn:hover { background: var(--teal-dark); }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--brick);
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            font-family: 'Space Mono', monospace;
        }
        nav.cats {
            background: var(--teal);
            overflow-x: auto;
        }
        .cats-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            padding: 0 20px;
        }
        .cat-tab {
            position: relative;
            padding: 13px 18px 19px;
            color: var(--paper);
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            background: none;
            border: none;
            opacity: .85;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .cat-tab.active {
            opacity: 1;
            color: var(--white);
        }
        .cat-tab.active::after {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 0;
            height: 8px;
            background: var(--marigold);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .hero {
            max-width: 1240px;
            margin: 26px auto 0;
            padding: 0 20px;
        }
        .board {
            background: var(--ink);
            border-radius: 10px;
            padding: 26px 30px;
            color: var(--paper);
            display: grid;
            grid-template-columns: 1.1fr 1fr 1fr;
            gap: 26px;
        }
        .board-head {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .board-head .eyebrow {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--marigold);
            letter-spacing: .08em;
            margin-bottom: 8px;
        }
        .board-head h1 {
            font-size: clamp(22px, 4vw, 34px);
            line-height: 1.08;
            margin: 0 0 12px;
        }
        .board-head p {
            font-size: 14px;
            opacity: .75;
            margin: 0;
            max-width: 34ch;
            line-height: 1.5;
        }
        .deal-card {
            background: rgba(255,255,255,.04);
            border: 1px dashed rgba(255,255,255,.28);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .deal-card .name {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.3;
        }
        .deal-card .now {
            color: var(--marigold);
            font-size: 19px;
            font-weight: 700;
        }
        .deal-card .old {
            font-size: 13px;
            text-decoration: line-through;
            opacity: .5;
        }
        .deal-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--brick);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .layout {
            max-width: 1240px;
            margin: 30px auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 28px;
            align-items: start;
        }
        aside.filters {
            background: var(--sand);
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 118px;
        }
        aside.filters h3 {
            font-size: 14px;
            margin: 0 0 12px;
            color: var(--teal-dark);
        }
        .filter-group { margin-bottom: 22px; }
        .filter-group:last-child { margin-bottom: 0; }
        .check-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13.5px;
            padding: 5px 0;
            cursor: pointer;
        }
        .check-row input {
            accent-color: var(--teal);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .price-range {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .price-range input[type=range] {
            accent-color: var(--marigold);
            width: 100%;
        }
        .price-range .val {
            font-family: 'Space Mono', monospace;
            font-size: 12.5px;
            color: var(--teal-dark);
        }
        .reset-btn {
            margin-top: 18px;
            width: 100%;
            background: none;
            border: 1.5px solid var(--teal);
            color: var(--teal-dark);
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .reset-btn:hover {
            background: var(--teal);
            color: #fff;
        }
        .results-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .results-bar h2 {
            font-size: 18px;
            margin: 0;
        }
        .results-bar .count {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 400;
            color: var(--teal-dark);
            margin-left: 8px;
        }
        select#sort {
            border: 1.5px solid var(--sand-line);
            background: var(--white);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13.5px;
            color: var(--ink);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--sand-line);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card .thumb {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--sand);
        }
        .card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card .sale-flag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--brick);
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            z-index: 2;
        }
        .card .cat-label {
            font-size: 11px;
            color: var(--teal-dark);
            font-weight: 600;
            text-transform: uppercase;
        }
        .card .name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            min-height: 38px;
        }
        .tag-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }
        .price-tag {
            position: relative;
            background: var(--sand);
            border: 1.5px dashed var(--sand-line);
            padding: 7px 14px 7px 22px;
            border-radius: 3px;
            clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%);
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .price-tag::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 50%;
            width: 5px;
            height: 5px;
            background: var(--paper);
            border: 1.5px solid var(--sand-line);
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .price-tag .now {
            font-size: 16px;
            font-weight: 700;
            color: var(--teal-dark);
        }
        .price-tag .old {
            font-size: 11px;
            color: #9a8d6f;
            text-decoration: line-through;
        }
        .add-btn {
            margin-top: 4px;
            background: var(--marigold);
            border: none;
            color: var(--ink);
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13.5px;
        }
        .add-btn:hover { background: var(--marigold-dark); }
        .add-btn.added {
            background: var(--teal);
            color: #fff;
        }
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: #8a7f66;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(27,36,48,.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
            z-index: 90;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px;
            max-width: 92vw;
            height: 100%;
            background: var(--paper);
            box-shadow: -8px 0 30px rgba(0,0,0,.15);
            transform: translateX(100%);
            transition: transform .28s ease;
            z-index: 95;
            display: flex;
            flex-direction: column;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-head {
            background: var(--ink);
            color: var(--paper);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--marigold);
        }
        .drawer-head h3 {
            margin: 0;
            font-size: 17px;
        }
        .drawer-head button {
            background: none;
            border: none;
            color: var(--paper);
            font-size: 22px;
            line-height: 1;
        }
        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .cart-item {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--sand-line);
            padding-bottom: 14px;
        }
        .cart-item .thumb-sm {
            width: 56px;
            height: 56px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--sand);
        }
        .cart-item .thumb-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item .info {
            flex: 1;
            min-width: 0;
        }
        .cart-item .name {
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .qty-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-row button {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            border: 1px solid var(--sand-line);
            background: var(--white);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-row .qty {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            min-width: 18px;
            text-align: center;
        }
        .cart-item .line-price {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--teal-dark);
            white-space: nowrap;
        }
        .remove-btn {
            background: none;
            border: none;
            color: var(--brick);
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
            padding: 0;
        }
        .cart-empty {
            text-align: center;
            padding: 50px 10px;
            color: #9a8d6f;
        }
        .drawer-foot {
            padding: 18px 20px 22px;
            border-top: 1px solid var(--sand-line);
            background: var(--sand);
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }
        .total-row .label {
            font-size: 13px;
            color: var(--teal-dark);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .03em;
        }
        .total-row .sum {
            font-family: 'Space Mono', monospace;
            font-size: 22px;
            font-weight: 700;
        }
        .checkout-btn {
            width: 100%;
            background: var(--teal);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 7px;
            font-weight: 700;
            font-size: 14.5px;
        }
        .checkout-btn:hover { background: var(--teal-dark); }
        .checkout-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: var(--ink);
            color: var(--paper);
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 120;
            border-left: 4px solid var(--marigold);
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        footer.site {
            background: var(--ink);
            color: var(--paper);
            text-align: center;
            padding: 26px 20px;
            font-size: 12.5px;
            opacity: .65;
        }
        .filters-toggle {
            display: none;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            background: var(--sand);
            border: 1px solid var(--sand-line);
            color: var(--ink);
            padding: 12px 16px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 14px;
        }
        .filters-toggle .chev { transition: transform .2s; }
        .filters-toggle.open .chev { transform: rotate(180deg); }
        .delivery-overlay {
            position: fixed;
            inset: 0;
            background: rgba(27,36,48,0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .delivery-overlay.open { display: flex; }
        .delivery-modal {
            background: var(--paper);
            border-radius: 20px;
            max-width: 540px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            border: 2px solid var(--sand-line);
        }
        .delivery-header {
            background: var(--ink);
            color: var(--paper);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 18px 18px 0 0;
            border-bottom: 4px solid var(--marigold);
        }
        .delivery-header h3 {
            margin: 0;
            font-size: 20px;
            font-family: 'Oswald', sans-serif;
        }
        .delivery-close {
            background: none;
            border: none;
            color: var(--paper);
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
        }
        .delivery-body { padding: 28px 28px 24px; }
        .delivery-field { margin-bottom: 20px; }
        .delivery-field label {
            display: block;
            font-weight: 600;
            font-size: 13.5px;
            margin-bottom: 6px;
            color: var(--teal-dark);
        }
        .delivery-field select,
        .delivery-field input,
        .delivery-field textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--sand-line);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--white);
        }
        .delivery-field select:focus,
        .delivery-field input:focus,
        .delivery-field textarea:focus {
            border-color: var(--marigold);
            outline: none;
        }
        .delivery-field textarea {
            min-height: 70px;
            resize: vertical;
        }
        .delivery-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 18px 0 22px;
            padding: 18px 20px;
            background: var(--sand);
            border-radius: 12px;
            border: 1px solid var(--sand-line);
        }
        .delivery-option {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
        }
        .delivery-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--teal);
            cursor: pointer;
        }
        .delivery-order-summary {
            background: var(--white);
            border-radius: 12px;
            padding: 18px 20px;
            margin: 18px 0 22px;
            border: 2px solid var(--sand-line);
        }
        .delivery-order-summary h4 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: var(--teal-dark);
        }
        .delivery-order-summary #deliveryItems {
            font-size: 13.5px;
            line-height: 1.7;
            max-height: 130px;
            overflow-y: auto;
        }
        .delivery-order-summary #deliveryItems .item-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed var(--sand-line);
        }
        .delivery-order-summary #deliveryItems .item-row:last-child {
            border-bottom: none;
        }
        .delivery-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 14px;
            margin-top: 12px;
            border-top: 3px solid var(--marigold);
            font-weight: 700;
            font-size: 20px;
            color: var(--teal-dark);
        }
        .delivery-submit {
            width: 100%;
            background: var(--teal);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
        }
        .delivery-submit:hover { background: var(--teal-dark); }
        .delivery-submit:active { transform: scale(0.97); }
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 190px 1fr;
                gap: 20px;
            }
            .board {
                grid-template-columns: 1fr 1fr;
            }
            .board-head {
                grid-column: 1/-1;
            }
        }
        @media (max-width: 860px) {
            .top-bar {
                flex-wrap: wrap;
                row-gap: 10px;
            }
            .logo { font-size: 22px; }
            .search-wrap {
                order: 3;
                max-width: 100%;
                width: 100%;
            }
            .header-actions { margin-left: 0; }
            .layout { grid-template-columns: 1fr; }
            .filters-toggle { display: flex; }
            aside.filters {
                position: static;
                display: none;
                margin-bottom: 18px;
            }
            aside.filters.open { display: block; }
            .board {
                grid-template-columns: 1fr;
                padding: 22px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
        }
        @media (max-width: 560px) {
            .top-bar {
                padding: 12px 14px;
                gap: 12px;
            }
            .logo { font-size: 19px; }
            .cart-btn { padding: 9px 12px; }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .drawer {
                width: 100vw;
                max-width: 100vw;
            }
            .delivery-modal {
                max-width: 100%;
                border-radius: 16px;
                margin: 10px;

const PRODUCTS = [

    { id: 18, cat: 'kids', name: 'Дитячий велосипед KidRide 16"', price: 3299, old: 3799, img: 'https://images.unsplash.com/photo-1571068316344-75bc76f77890?w=400&h=400&fit=crop' },

    { id: 20, cat: 'kids', name: 'Пазл «Мандрівка світом» 1000 дет.', price: 349, old: null, img: 'https://images.unsplash.com/photo-1606092195730-5d7b9af1efc5?w=400&h=400&fit=crop' },
    { id: 21, cat: 'sport', name: 'Гантелі набірні PowerSet 20 кг', price: 1799, old: null, img: 'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=400&h=400&fit=crop' },
    { id: 22, cat: 'sport', name: 'Килимок для йоги FlexMat', price: 599, old: null, img: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=400&h=400&fit=crop' },
    { id: 23, cat: 'sport', name: 'Футбольний м\'яч ProKick', price: 749, old: 899, img: 'https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=400&h=400&fit=crop' },
    { id: 24, cat: 'sport', name: 'Спортивний рюкзак TrainBag', price: 899, old: null, img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&h=400&fit=crop' }
];

const catMap = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

let state = {
    activeCat: 'all',
    checkedCats: new Set(),
    search: '',
    priceMax: 60000,
    onlySale: false,
    sort: 'default',
    cart: {}
};

function fmt(n) {
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== КОРЗИНА =====
function addToCart(id) {
    state.cart[id] = (state.cart[id] || 0) + 1;
    const p = PRODUCTS.find(item => item.id === id);
    if (p) showToast(`Додано: ${p.name}`);
    renderCartCount();
    renderCartBody();
    renderGrid();
}

function changeQty(id, delta) {
    if (!state.cart[id]) return;
    state.cart[id] += delta;
    if (state.cart[id] <= 0) delete state.cart[id];
    renderCartCount();
    renderCartBody();
    renderGrid();
}

function renderCartCount() {
    const el = document.getElementById('cartCount');
    if (!el) return;
    const total = Object.values(state.cart).reduce((s, n) => s + n, 0);
    el.textContent = total;
}

function renderCartBody() {
    const body = document.getElementById('cartBody');
    if (!body) return;
    
    const ids = Object.keys(state.cart);
    if (ids.length === 0) {
        body.innerHTML = `<div class="cart-empty">Кошик порожній</div>`;
        document.getElementById('cartSubtotal').textContent = '0 ₴';
        return;
    }

    let html = '';
    let total = 0;
    ids.forEach(id => {
        const p = PRODUCTS.find(item => item.id === Number(id));
        if (!p) return;
        const qty = state.cart[id];
        const sum = p.price * qty;
        total += sum;
        html += `
            <div class="cart-item">
                <div class="thumb-sm"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
                <div class="info">
                    <div class="name">${p.name}</div>
                    <div class="qty-row">
                        <button onclick="changeQty(${p.id}, -1)">−</button>
                        <span class="qty">${qty}</span>
                        <button onclick="changeQty(${p.id}, 1)">+</button>
                    </div>
                </div>
                <div class="line-price">${fmt(sum)} ₴</div>
                <button class="remove-btn" onclick="changeQty(${p.id}, -${qty})">×</button>
            </div>
        `;
    });
    body.innerHTML = html;
    document.getElementById('cartSubtotal').textContent = fmt(total) + ' ₴';
}

// ===== ОТКРЫТИЕ/ЗАКРЫТИЕ КОРЗИНЫ =====
document.getElementById('openCart')?.addEventListener('click', function() {
    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
});

document.getElementById('closeCart')?.addEventListener('click', function() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
});

document.getElementById('overlay')?.addEventListener('click', function() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
});

// ===== КАТЕГОРИИ =====
function renderCatTabs() {
    const wrap = document.getElementById('catTabs');
    if (!wrap) return;

    const all = [{ id: 'all', name: 'Усі товари' }, ...CATEGORIES];
    wrap.innerHTML = all.map(c => `
        <button class="cat-tab ${state.activeCat === c.id ? 'active' : ''}" data-cat="${c.id}">
            ${c.name}
        </button>
    `).join('');

    wrap.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', function () {
            state.activeCat = this.dataset.cat;
            state.checkedCats.clear();
            renderFilterChecks();
            renderCatTabs();
            renderGrid();
        });
    });
}

function renderFilterChecks() {
    const wrap = document.getElementById('catChecks');
    if (!wrap) return;

    wrap.innerHTML = CATEGORIES.map(c => `
        <label class="check-row">
            <input type="checkbox" value="${c.id}" ${state.checkedCats.has(c.id) ? 'checked' : ''}>
            ${c.name}
        </label>
    `).join('');

    wrap.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', function () {
            if (this.checked) {
                state.checkedCats.add(this.value);
                state.activeCat = 'all';
            } else {
                state.checkedCats.delete(this.value);
            }
            renderCatTabs();
            renderGrid();
        });
    });
}

// ===== BOARD (СПЕЦПРЕДЛОЖЕНИЯ) =====
function renderBoard() {
    const board = document.getElementById('board');
    if (!board) return;

    const deals = PRODUCTS.filter(p => p.old !== null).slice(0, 3);

    if (deals.length === 0) {
        board.innerHTML = `<div class="board-head"><h1>Спеціальні пропозиції</h1></div>`;
        return;
    }

    board.innerHTML = `
        <div class="board-head">
            <div class="eyebrow">// сьогоднішні знижки</div>
            <h1>Торгуємось чесно</h1>
            <p>Три позиції з найбільшою вигодою на сьогодні</p>
        </div>
        ${deals.map(d => {
            const off = Math.round(100 - (d.price / d.old * 100));
            return `
            <div class="deal-card">
                <span class="badge">-${off}%</span>
                <img src="${d.img}" alt="${d.name}" width="60" height="60" style="border-radius:10px;object-fit:cover;">
                <span class="name">${d.name}</span>
                <div class="prices">
                    <span class="now">${fmt(d.price)} ₴</span>
                    <span class="old">${fmt(d.old)} ₴</span>
                </div>
            </div>`;
        }).join('')}
    `;
}

// ===== ФИЛЬТРАЦИЯ =====
function getFiltered() {
    let list = PRODUCTS.slice();

    if (state.checkedCats.size > 0) {
        list = list.filter(p => state.checkedCats.has(p.cat));
    } else if (state.activeCat !== 'all') {
        list = list.filter(p => p.cat === state.activeCat);
    }

    if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q));
    }

    list = list.filter(p => p.price <= state.priceMax);

    if (state.onlySale) {
        list = list.filter(p => p.old !== null);
    }

    switch (state.sort) {
        case 'price-asc':
            list.sort((a, b) => a.price - b.price);
            break;
        case 'price-desc':
            list.sort((a, b) => b.price - a.price);
            break;
        case 'name':
            list.sort((a, b) => a.name.localeCompare(b.name, 'uk'));
            break;
    }

    return list;
}

// ===== СЕТКА ТОВАРОВ =====
function renderGrid() {
    const grid = document.getElementById('grid');
    if (!grid) return;

    const list = getFiltered();
    const resultCount = document.getElementById('resultCount');
    if (resultCount) resultCount.textContent = `(${list.length})`;

    if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state">Нічого не знайдено</div>`;
        return;
    }

    grid.innerHTML = list.map(p => {
        const c = catMap[p.cat];
        const inCart = state.cart[p.id] || 0;

        return `
        <div class="card">
            <div class="thumb" style="background:${c ? c.color : '#eee'}">
                ${p.old !== null ? `<span class="sale-flag">Знижка</span>` : ''}
                <img src="${p.img}" 
                     alt="${p.name}" 
                     loading="lazy"
                     onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect fill=%22%23e8e8e8%22 width=%22400%22 height=%22400%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-family=%22sans-serif%22 font-size=%2218%22%3EНемає фото%3C/text%3E%3C/svg%3E';">
            </div>
            <div class="cat-label">${c ? c.name : ''}</div>
            <div class="name">${p.name}</div>
            <div class="tag-row">
                <div class="price-tag">
                    <span class="now">${fmt(p.price)} ₴</span>
                    ${p.old !== null ? `<span class="old">${fmt(p.old)} ₴</span>` : ''}
                </div>
            </div>
            <button class="add-btn ${inCart > 0 ? 'added' : ''}" data-id="${p.id}">
                ${inCart > 0 ? `У кошику (${inCart})` : 'Додати в кошик'}
            </button>
        </div>`;
    }).join('');

    grid.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            const id = Number(this.dataset.id);
            addToCart(id);
        });
    });
}

    e.preventDefault();
    const input = document.getElementById('searchInput');

    renderGrid();

    document.getElementById('searchInput').value = '';
    document.getElementById('priceMax').value = 60000;
    document.getElementById('priceMaxVal').textContent = '60000';
    document.getElementById('onlySale').checked = false;
    document.getElementById('sort').value = 'default';
    
    renderFilterChecks();
    renderCatTabs();
    renderGrid();

document.getElementById('checkoutBtn')?.addEventListener('click', function() {
    const total = Object.values(state.cart).reduce((s, n) => s + n, 0);
    if (total === 0) {
        showToast('Кошик порожній');
        return;
    }
    renderDeliveryItems();
    document.getElementById('deliveryOverlay').classList.add('open');
});

document.getElementById('deliveryClose')?.addEventListener('click', function() {
    document.getElementById('deliveryOverlay').classList.remove('open');
});

document.getElementById('deliveryOverlay')?.addEventListener('click', function(e) {
    if (e.target === this) {
        this.classList.remove('open');
    }
});

function renderDeliveryItems() {
    const container = document.getElementById('deliveryItems');
    if (!container) return;
    
    const ids = Object.keys(state.cart);
    if (ids.length === 0) {
        container.innerHTML = '<p>Кошик порожній</p>';
        document.getElementById('deliveryTotalPrice').textContent = '0 ₴';
        return;
    }
    
    let html = '';
    let total = 0;
    ids.forEach(id => {
        const p = PRODUCTS.find(item => item.id === Number(id));
        if (!p) return;
        const qty = state.cart[id];
        const sum = p.price * qty;
        total += sum;
        html += `<div class="item-row"><span>${p.name} × ${qty}</span><span>${fmt(sum)} ₴</span></div>`;
    });
    container.innerHTML = html;
    document.getElementById('deliveryTotalPrice').textContent = fmt(total) + ' ₴';
}

document.getElementById('deliveryForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const city = document.getElementById('citySelect').value;
    if (!city) {
        showToast('Оберіть місто доставки');
        return;
    }
    showToast('✅ Замовлення оформлено! Дякуємо за покупку!');
    state.cart = {};
    renderCartCount();
    renderCartBody();
    renderGrid();
    document.getElementById('deliveryOverlay').classList.remove('open');
});
