<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЯРМАРОК — маркетплейс товарів</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site">
        <div class="top-bar">
            <div class="logo">ЯРМАРОК<span>маркетплейс</span></div>
            <form class="search-wrap" id="searchForm">
                <input type="text" id="searchInput" placeholder="Пошук товарів..." autocomplete="off">
                <button type="submit">Знайти</button>
            </form>
            <div class="header-actions">
                <button class="cart-btn" id="openCart">
                    🛒 Кошик
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
        <nav class="cats">
            <div class="cats-inner" id="catTabs"></div>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <div class="hero">
        <div class="board" id="board"></div>
    </div>

    <!-- ===== LAYOUT ===== -->
    <div class="layout">
        <button class="filters-toggle" id="filtersToggle" aria-expanded="false">
            <span>🔧 Фільтри та сортування</span>
            <span class="chev">▾</span>
        </button>
        <aside class="filters" id="filtersPanel">
            <h3>Категорії</h3>
            <div class="filter-group" id="catChecks"></div>
            <h3>Ціна, ₴</h3>
            <div class="filter-group price-range">
                <input type="range" id="priceMax" min="0" max="60000" step="100" value="60000">
                <div class="val">до <span id="priceMaxVal">60000</span> ₴</div>
            </div>
            <h3>Наявність</h3>
            <div class="filter-group">
                <label class="check-row">
                    <input type="checkbox" id="onlySale"> Тільки зі знижкою
                </label>
            </div>
            <button class="reset-btn" id="resetFilters">Скинути фільтри</button>
        </aside>
        <main>
            <div class="results-bar">
                <h2>Товари <span class="count" id="resultCount"></span></h2>
                <select id="sort">
                    <option value="default">За популярністю</option>
                    <option value="price-asc">Спочатку дешевші</option>
                    <option value="price-desc">Спочатку дорожчі</option>
                    <option value="name">За назвою</option>
                </select>
            </div>
            <div class="grid" id="grid"></div>
        </main>
    </div>

    <footer class="site">© 2026 ЯРМАРОК — навчальний демо-маркетплейс</footer>

    <!-- ===== CART DRAWER ===== -->
    <div class="overlay" id="overlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-head">
            <h3>🛒 Ваш кошик</h3>
            <button id="closeCart">×</button>
        </div>
        <div class="drawer-body" id="cartBody"></div>
        <div class="drawer-foot">
            <div class="total-row">
                <span class="label">Товари</span>
                <span class="sum" id="cartSubtotal">0 ₴</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Оформити замовлення</button>
        </div>
    </div>

    <!-- ===== DELIVERY MODAL ===== -->
    <div class="delivery-overlay" id="deliveryOverlay">
        <div class="delivery-modal">
            <div class="delivery-header">
                <h3>🛒 Оформлення замовлення</h3>
                <button class="delivery-close" id="deliveryClose">×</button>
            </div>
            <div class="delivery-body">
                <form id="deliveryForm">
                    <div class="delivery-field">
                        <label for="citySelect">📍 Місто доставки</label>
                        <select id="citySelect" required>
                            <option value="">Оберіть місто</option>
                            <option value="kyiv">Київ</option>
                            <option value="lviv">Львів</option>
                            <option value="odesa">Одеса</option>
                            <option value="dnipro">Дніпро</option>
                            <option value="kharkiv">Харків</option>
                            <option value="zaporizhzhia">Запоріжжя</option>
                            <option value="khmelnytskyi">Хмельницький</option>
                            <option value="vinnytsia">Вінниця</option>
                            <option value="cherkasy">Черкаси</option>
                            <option value="zhytomyr">Житомир</option>
                        </select>
                    </div>
                    <div class="delivery-field">
                        <label for="streetAddress">🏠 Вулиця, будинок, квартира</label>
                        <input type="text" id="streetAddress" placeholder="вул. Хрещатик, 1, кв. 10" required>
                    </div>
                    <div class="delivery-field">
                        <label for="postalCode">📮 Поштовий індекс</label>
                        <input type="text" id="postalCode" placeholder="01001" required pattern="[0-9]{5}" maxlength="5">
                    </div>
                    <div class="delivery-options">
                        <label class="delivery-option">
                            <input type="radio" name="deliveryType" value="courier" checked>
                            🚚 Кур'єр (безкоштовно)
                        </label>
                        <label class="delivery-option">
                            <input type="radio" name="deliveryType" value="nova-poshta">
                            📦 Нова Пошта (за тарифами)
                        </label>
                        <label class="delivery-option">
                            <input type="radio" name="deliveryType" value="self-pickup">
                            🏪 Самовивіз (безкоштовно)
                        </label>
                    </div>
                    <div class="delivery-field">
                        <label for="orderComment">💬 Коментар до замовлення</label>
                        <textarea id="orderComment" placeholder="Ваші побажання до замовлення"></textarea>
                    </div>
                    <div class="delivery-order-summary">
                        <h4>📋 Ваше замовлення</h4>
                        <div id="deliveryItems"></div>
                        <div class="delivery-total">
                            <span>Разом до сплати</span>
                            <span id="deliveryTotalPrice">0 ₴</span>
                        </div>
                    </div>
                    <button type="submit" class="delivery-submit">✅ Підтвердити замовлення</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
